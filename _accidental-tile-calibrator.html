<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accidental Tile Calibrator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f5f0e8; padding: 20px; max-width: 600px; margin: 0 auto; }
h1 { font-size: 20px; margin-bottom: 12px; }
h3 { font-size: 14px; margin: 16px 0 6px; color: #555; }

.preview {
  background: #fff;
  border: 3px solid #2a2a3e;
  border-radius: 18px;
  padding: 20px;
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}
.preview svg { width: 300px; height: 195px; }

.controls {
  display: grid;
  grid-template-columns: 140px 1fr 50px;
  gap: 5px 10px;
  align-items: center;
  font-size: 13px;
}
.controls label { font-weight: 600; }
.controls input[type=range] { width: 100%; }
.controls .val { font-family: monospace; text-align: right; font-size: 12px; }

.output {
  background: #1e1e2e;
  color: #a6e3a1;
  font-family: monospace;
  font-size: 12px;
  padding: 14px;
  border-radius: 10px;
  white-space: pre-wrap;
  margin: 16px 0;
  cursor: pointer;
}
.output:hover::after { content: ' (click to copy)'; color: #666; }
</style>
</head>
<body>

<h1>Accidental Tile Calibrator</h1>
<p style="font-size:13px;color:#666;margin-bottom:16px;">Adjust the sharp and note position on the accidentals tile.</p>

<div class="preview" id="preview"></div>

<h3>Sharp glyph</h3>
<div class="controls">
  <label>sharp x</label>
  <input type="range" id="sharp-x" min="50" max="110" value="78">
  <span class="val" id="sharp-x-val">78</span>

  <label>sharp y</label>
  <input type="range" id="sharp-y" min="20" max="70" value="56">
  <span class="val" id="sharp-y-val">56</span>

  <label>sharp size</label>
  <input type="range" id="sharp-size" min="16" max="44" value="30">
  <span class="val" id="sharp-size-val">30</span>
</div>

<h3>Notehead</h3>
<div class="controls">
  <label>note cx</label>
  <input type="range" id="note-cx" min="60" max="140" value="98">
  <span class="val" id="note-cx-val">98</span>

  <label>note cy</label>
  <input type="range" id="note-cy" min="20" max="70" value="50">
  <span class="val" id="note-cy-val">50</span>
</div>

<h3>Stem</h3>
<div class="controls">
  <label>stem top y</label>
  <input type="range" id="stem-top" min="5" max="50" value="28">
  <span class="val" id="stem-top-val">28</span>
</div>

<h3>Output</h3>
<div class="output" id="output"></div>

<script>
var IDS = ['sharp-x','sharp-y','sharp-size','note-cx','note-cy','stem-top'];

function render() {
  var v = {};
  IDS.forEach(function(id) {
    v[id] = parseFloat(document.getElementById(id).value);
    document.getElementById(id+'-val').textContent = v[id];
  });

  var sx = v['sharp-x'], sy = v['sharp-y'], ss = v['sharp-size'];
  var ncx = v['note-cx'], ncy = v['note-cy'];
  var stemX = ncx + 5, stemTop = v['stem-top'];

  var svg = '<svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">';
  svg += '<rect width="200" height="130" rx="12" fill="#E8E0F0" opacity="0.5"/>';
  // Staff lines
  svg += '<g stroke="#2A2A3E" stroke-width="1.4" opacity="0.85">';
  [22,30,38,46,54].forEach(function(y){
    svg += '<line x1="24" y1="'+y+'" x2="176" y2="'+y+'"/>';
  });
  svg += '</g>';
  // Sharp
  svg += '<text x="'+sx+'" y="'+sy+'" font-family="serif" font-weight="700" font-size="'+ss+'" fill="#2A2A3E" text-anchor="end">&#x266F;</text>';
  // Notehead
  svg += '<ellipse cx="'+ncx+'" cy="'+ncy+'" rx="6" ry="4.2" transform="rotate(-20 '+ncx+' '+ncy+')" fill="#5B3FE4" stroke="#2A2A3E" stroke-width="1.5"/>';
  // Stem
  svg += '<line x1="'+stemX+'" y1="'+ncy+'" x2="'+stemX+'" y2="'+stemTop+'" stroke="#2A2A3E" stroke-width="1.6" stroke-linecap="round"/>';
  svg += '</svg>';

  document.getElementById('preview').innerHTML = svg;

  var out = '<text x="'+sx+'" y="'+sy+'" font-size="'+ss+'">\n';
  out += '<ellipse cx="'+ncx+'" cy="'+ncy+'">\n';
  out += '<line x1="'+stemX+'" y1="'+ncy+'" x2="'+stemX+'" y2="'+stemTop+'">';
  document.getElementById('output').textContent = out;
}

IDS.forEach(function(id) {
  document.getElementById(id).addEventListener('input', render);
});

document.getElementById('output').addEventListener('click', function(){
  navigator.clipboard.writeText(this.textContent);
});

render();
</script>
</body>
</html>
