<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tie &amp; Dot Calibrator — QuizNote</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/BravuraText.woff2" crossorigin>
<style>
@font-face {
  font-family: 'Bravura Text';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/BravuraText.woff2') format('woff2'),
       url('https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/BravuraText.woff') format('woff');
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, sans-serif;
  background: #f5f0e8;
  color: #2a2a3e;
  padding: 20px;
  max-width: 800px;
  margin: 0 auto;
}
h1 { font-size: 22px; margin-bottom: 8px; }
h2 { font-size: 17px; margin: 24px 0 10px; border-bottom: 2px solid #ccc; padding-bottom: 4px; }
h3 { font-size: 14px; margin: 16px 0 6px; color: #666; }

/* ── Preview area ── */
.preview-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.preview-card {
  background: #fff;
  border: 3px solid #2a2a3e;
  border-radius: 18px;
  width: 320px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.preview-label {
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  color: #888;
}
.preview-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 180px;
  overflow: hidden;
  position: relative;
  border: 1px dashed #ddd;
}
.preview-wrap::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  border-top: 1px dashed rgba(255,0,0,0.25);
  pointer-events: none;
}

/* ── Symbol rendering (mirrors dotted-notes.html) ── */
.dn-symbol {
  font-family: 'Bravura Text', serif;
  font-size: var(--dn-font-size, 140px);
  line-height: var(--dn-line-height, 1.4);
  color: #2a2a3e;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dn-symbol.dn-tied {
  position: relative;
  flex-direction: row;
  gap: 0;
  padding-bottom: var(--tie-pad-bottom, 18px);
}
.dn-symbol.dn-tied .dn-glyph {
  font-family: inherit;
  font-size: inherit;
  line-height: 1;
  display: inline-block;
}
.dn-symbol.dn-tied .dn-tie-gap {
  display: inline-block;
  width: var(--tie-note-gap, 30px);
}
.dn-symbol.dn-tied .dn-tie-arc {
  position: absolute;
  bottom: var(--tie-bottom, 38px);
  left: var(--tie-left, 32%);
  width: var(--tie-width, 36%);
  height: var(--tie-height, 22px);
  border: var(--tie-border, 3px) solid currentColor;
  border-top: 0;
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
  pointer-events: none;
}

/* Dot rendering */
.dn-dot {
  display: inline-block;
  margin-left: var(--dot-ml, 0px);
  position: relative;
  top: var(--dot-top, 0px);
}

/* ── Controls ── */
.controls {
  display: grid;
  grid-template-columns: 140px 1fr 60px;
  gap: 6px 10px;
  align-items: center;
  font-size: 13px;
}
.controls label { font-weight: 600; }
.controls input[type=range] { width: 100%; }
.controls .val { font-family: monospace; text-align: right; }

/* ── Output ── */
.output {
  background: #1e1e2e;
  color: #a6e3a1;
  font-family: monospace;
  font-size: 12px;
  padding: 14px;
  border-radius: 10px;
  white-space: pre-wrap;
  margin: 12px 0;
  cursor: pointer;
  position: relative;
}
.output:hover::after {
  content: 'click to copy';
  position: absolute;
  top: 6px; right: 10px;
  font-size: 11px;
  color: #666;
}
.copied::after { content: 'copied!' !important; color: #a6e3a1 !important; }
</style>
</head>
<body>

<h1>Tie &amp; Dot Calibrator</h1>
<p style="font-size:13px;color:#666;">Adjust sliders to tune tie arc position/shape and dot spacing. Click the CSS output to copy.</p>

<!-- ═══ SECTION 1: Current state ═══ -->
<h2>1 &mdash; Current Rendering</h2>
<div class="preview-row" id="previews"></div>

<!-- ═══ SECTION 2: Tie Controls ═══ -->
<h2>2 &mdash; Tie Arc Controls</h2>
<div class="controls" id="tie-controls">
  <label>bottom (px)</label>
  <input type="range" id="tie-bottom" min="20" max="120" value="38">
  <span class="val" id="tie-bottom-val">38</span>

  <label>left (%)</label>
  <input type="range" id="tie-left" min="10" max="50" value="32">
  <span class="val" id="tie-left-val">32</span>

  <label>width (%)</label>
  <input type="range" id="tie-width" min="15" max="70" value="36">
  <span class="val" id="tie-width-val">36</span>

  <label>height (px)</label>
  <input type="range" id="tie-height" min="6" max="40" value="22">
  <span class="val" id="tie-height-val">22</span>

  <label>border (px)</label>
  <input type="range" id="tie-border" min="1" max="6" value="3" step="0.5">
  <span class="val" id="tie-border-val">3</span>

  <label>note gap (px)</label>
  <input type="range" id="tie-note-gap" min="0" max="60" value="30">
  <span class="val" id="tie-note-gap-val">30</span>

  <label>pad-bottom (px)</label>
  <input type="range" id="tie-pad-bottom" min="0" max="40" value="18">
  <span class="val" id="tie-pad-bottom-val">18</span>
</div>

<!-- ═══ SECTION 3: Dot Controls ═══ -->
<h2>3 &mdash; Dot Controls</h2>
<div class="controls" id="dot-controls">
  <label>margin-left (px)</label>
  <input type="range" id="dot-ml" min="-10" max="20" value="0">
  <span class="val" id="dot-ml-val">0</span>

  <label>vertical (px)</label>
  <input type="range" id="dot-top" min="-30" max="30" value="0">
  <span class="val" id="dot-top-val">0</span>
</div>

<!-- ═══ SECTION 4: Font Size (bleed fix) ═══ -->
<h2>4 &mdash; Symbol Size (bleed fix)</h2>
<div class="controls" id="size-controls">
  <label>font-size (px)</label>
  <input type="range" id="dn-font-size" min="80" max="160" value="140">
  <span class="val" id="dn-font-size-val">140</span>

  <label>line-height</label>
  <input type="range" id="dn-line-height" min="0.8" max="2.0" value="1.4" step="0.05">
  <span class="val" id="dn-line-height-val">1.4</span>
</div>

<!-- ═══ SECTION 5: CSS Output ═══ -->
<h2>5 &mdash; CSS Output</h2>
<div class="output" id="css-output"></div>

<script>
const AUG_DOT = '';
const GLYPHS = {
  quarter: '',
  eighth: '',
  half: '',
  whole: '',
  sixteenth: '',
};

const EXAMPLES = [
  { label: 'Tied quarter + eighth', kind: 'tied', parts: [
    { char: GLYPHS.quarter, dotted: false },
    { char: GLYPHS.eighth, dotted: false }
  ]},
  { label: 'Tied half + quarter', kind: 'tied', parts: [
    { char: GLYPHS.half, dotted: false },
    { char: GLYPHS.quarter, dotted: false }
  ]},
  { label: 'Tied dotted quarter + eighth', kind: 'tied', parts: [
    { char: GLYPHS.quarter, dotted: true },
    { char: GLYPHS.eighth, dotted: false }
  ]},
  { label: 'Tied half + half', kind: 'tied', parts: [
    { char: GLYPHS.half, dotted: false },
    { char: GLYPHS.half, dotted: false }
  ]},
  { label: 'Dotted quarter', kind: 'single', char: GLYPHS.quarter, dotted: true },
  { label: 'Dotted eighth', kind: 'single', char: GLYPHS.eighth, dotted: true },
  { label: 'Dotted half', kind: 'single', char: GLYPHS.half, dotted: true },
  { label: 'Dotted sixteenth', kind: 'single', char: GLYPHS.sixteenth, dotted: true },
];

function renderPreviews() {
  const container = document.getElementById('previews');
  container.innerHTML = '';
  EXAMPLES.forEach((ex, i) => {
    const card = document.createElement('div');
    card.className = 'preview-card';
    const lbl = document.createElement('div');
    lbl.className = 'preview-label';
    lbl.textContent = ex.label;
    const wrap = document.createElement('div');
    wrap.className = 'preview-wrap';
    wrap.id = 'pw-' + i;

    if (ex.kind === 'tied') {
      const parts = ex.parts.map(p => {
        const dot = p.dotted ? '<span class="dn-dot">' + AUG_DOT + '</span>' : '';
        return '<span class="dn-glyph">' + p.char + dot + '</span>';
      }).join('<span class="dn-tie-gap"></span>');
      wrap.innerHTML = '<div class="dn-symbol dn-tied">' + parts + '<span class="dn-tie-arc"></span></div>';
    } else {
      const dot = ex.dotted ? '<span class="dn-dot">' + AUG_DOT + '</span>' : '';
      wrap.innerHTML = '<div class="dn-symbol">' + ex.char + dot + '</div>';
    }

    card.appendChild(lbl);
    card.appendChild(wrap);
    container.appendChild(card);
  });
}

const SLIDER_IDS = [
  'tie-bottom', 'tie-left', 'tie-width', 'tie-height', 'tie-border',
  'tie-note-gap', 'tie-pad-bottom',
  'dot-ml', 'dot-top',
  'dn-font-size', 'dn-line-height',
];

function updateAll() {
  const root = document.documentElement.style;
  SLIDER_IDS.forEach(id => {
    const el = document.getElementById(id);
    const val = el.value;
    document.getElementById(id + '-val').textContent = val;

    switch (id) {
      case 'tie-bottom':    root.setProperty('--tie-bottom', val + 'px'); break;
      case 'tie-left':      root.setProperty('--tie-left', val + '%'); break;
      case 'tie-width':     root.setProperty('--tie-width', val + '%'); break;
      case 'tie-height':    root.setProperty('--tie-height', val + 'px'); break;
      case 'tie-border':    root.setProperty('--tie-border', val + 'px'); break;
      case 'tie-note-gap':  root.setProperty('--tie-note-gap', val + 'px'); break;
      case 'tie-pad-bottom': root.setProperty('--tie-pad-bottom', val + 'px'); break;
      case 'dot-ml':        root.setProperty('--dot-ml', val + 'px'); break;
      case 'dot-top':       root.setProperty('--dot-top', val + 'px'); break;
      case 'dn-font-size':  root.setProperty('--dn-font-size', val + 'px'); break;
      case 'dn-line-height': root.setProperty('--dn-line-height', val); break;
    }
  });
  updateOutput();
}

function updateOutput() {
  const v = {};
  SLIDER_IDS.forEach(id => { v[id] = document.getElementById(id).value; });

  const css = `.dn-symbol {
  font-size: ${v['dn-font-size']}px;
  line-height: ${v['dn-line-height']};
}
.dn-symbol.dn-tied {
  padding-bottom: ${v['tie-pad-bottom']}px;
}
.dn-symbol.dn-tied .dn-tie-gap {
  width: ${v['tie-note-gap']}px;
}
.dn-symbol.dn-tied .dn-tie-arc {
  bottom: ${v['tie-bottom']}px;
  left: ${v['tie-left']}%;
  width: ${v['tie-width']}%;
  height: ${v['tie-height']}px;
  border-width: ${v['tie-border']}px;
}
/* Dot: margin-left ${v['dot-ml']}px, top ${v['dot-top']}px */`;

  document.getElementById('css-output').textContent = css;
}

SLIDER_IDS.forEach(id => {
  document.getElementById(id).addEventListener('input', updateAll);
});

document.getElementById('css-output').addEventListener('click', function() {
  navigator.clipboard.writeText(this.textContent).then(() => {
    this.classList.add('copied');
    setTimeout(() => this.classList.remove('copied'), 1200);
  });
});

renderPreviews();
updateAll();
</script>
</body>
</html>
