<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tie &amp; Dot Calibrator — QuizNote</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/BravuraText.woff2" crossorigin>
<style>
@font-face {
  font-family: 'Bravura Text';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/BravuraText.woff2') format('woff2'),
       url('https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/BravuraText.woff') format('woff');
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, sans-serif;
  background: #f5f0e8;
  color: #2a2a3e;
  padding: 20px;
  max-width: 900px;
  margin: 0 auto;
}
h1 { font-size: 22px; margin-bottom: 8px; }
h2 { font-size: 17px; margin: 24px 0 10px; border-bottom: 2px solid #ccc; padding-bottom: 4px; }
h3 { font-size: 14px; margin: 16px 0 6px; color: #555; font-weight: 700; }

.preview-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.preview-card {
  background: #fff;
  border: 3px solid #2a2a3e;
  border-radius: 18px;
  width: 200px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.preview-label {
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  color: #888;
}
.preview-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 160px;
  overflow: hidden;
  position: relative;
}

/* ── Symbol rendering ── */
.dn-symbol {
  font-family: 'Bravura Text', serif;
  font-size: var(--dn-font-size, 140px);
  line-height: var(--dn-line-height, 1.4);
  color: #2a2a3e;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dn-symbol.dn-tied {
  position: relative;
  flex-direction: row;
  gap: 0;
  padding-bottom: var(--tie-pad-bottom, 0px);
}
.dn-symbol.dn-tied .dn-glyph {
  font-family: inherit;
  font-size: inherit;
  line-height: 1;
  display: inline-block;
}
.dn-symbol.dn-tied .dn-tie-gap {
  display: inline-block;
  width: var(--tie-note-gap, 26px);
}
.dn-symbol.dn-tied .dn-tie-arc {
  position: absolute;
  bottom: var(--tie-bottom, 65px);
  height: var(--tie-height, 19px);
  border: var(--tie-border, 3px) solid currentColor;
  border-top: 0;
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
  pointer-events: none;
}

/* ── Controls ── */
.controls {
  display: grid;
  grid-template-columns: 160px 1fr 50px;
  gap: 5px 10px;
  align-items: center;
  font-size: 13px;
}
.controls label { font-weight: 600; }
.controls input[type=range] { width: 100%; }
.controls .val { font-family: monospace; text-align: right; font-size: 12px; }

.output {
  background: #1e1e2e;
  color: #a6e3a1;
  font-family: monospace;
  font-size: 12px;
  padding: 14px;
  border-radius: 10px;
  white-space: pre-wrap;
  margin: 12px 0;
  cursor: pointer;
  position: relative;
}
.output:hover::after {
  content: 'click to copy';
  position: absolute;
  top: 6px; right: 10px;
  font-size: 11px;
  color: #666;
}
.copied::after { content: 'copied!' !important; color: #a6e3a1 !important; }
.font-preload {
  font-family: 'Bravura Text', serif;
  position: absolute;
  left: -9999px;
  font-size: 1px;
  visibility: hidden;
}
</style>
</head>
<body>
<span class="font-preload">&#xE1D5;&#xE1D3;&#xE1D7;&#xE1E7;</span>

<h1>Tie &amp; Dot Calibrator</h1>

<!-- ═══ SECTION 1: Tied notes ═══ -->
<h2>1 &mdash; Tied Notes</h2>
<div class="preview-row" id="tie-previews"></div>

<h3>Tie Arc</h3>
<div class="controls">
  <label>bottom (px)</label>
  <input type="range" id="tie-bottom" min="20" max="120" value="65">
  <span class="val" id="tie-bottom-val">65</span>

  <label>height (px)</label>
  <input type="range" id="tie-height" min="6" max="40" value="19">
  <span class="val" id="tie-height-val">19</span>

  <label>border (px)</label>
  <input type="range" id="tie-border" min="1" max="6" value="3" step="0.5">
  <span class="val" id="tie-border-val">3</span>

  <label>note gap (px)</label>
  <input type="range" id="tie-note-gap" min="0" max="60" value="26">
  <span class="val" id="tie-note-gap-val">26</span>

  <label>pad-bottom (px)</label>
  <input type="range" id="tie-pad-bottom" min="0" max="40" value="0">
  <span class="val" id="tie-pad-bottom-val">0</span>

  <label>glyph anchor (%)</label>
  <input type="range" id="tie-anchor" min="10" max="60" value="35">
  <span class="val" id="tie-anchor-val">35</span>
</div>

<!-- ═══ SECTION 2: Dotted notes (per-type) ═══ -->
<h2>2 &mdash; Dotted Notes</h2>
<div class="preview-row" id="dot-previews"></div>

<h3>Dot offset per note type (px from glyph edge)</h3>
<div class="controls">
  <label>Quarter dot-x</label>
  <input type="range" id="dot-quarter-x" min="-40" max="10" value="0">
  <span class="val" id="dot-quarter-x-val">0</span>

  <label>Half dot-x</label>
  <input type="range" id="dot-half-x" min="-40" max="10" value="0">
  <span class="val" id="dot-half-x-val">0</span>

  <label>Eighth dot-x</label>
  <input type="range" id="dot-eighth-x" min="-40" max="10" value="0">
  <span class="val" id="dot-eighth-x-val">0</span>

  <label>Sixteenth dot-x</label>
  <input type="range" id="dot-sixteenth-x" min="-40" max="10" value="0">
  <span class="val" id="dot-sixteenth-x-val">0</span>

  <label>Whole dot-x</label>
  <input type="range" id="dot-whole-x" min="-40" max="10" value="0">
  <span class="val" id="dot-whole-x-val">0</span>

  <label>All dot-y</label>
  <input type="range" id="dot-y" min="-30" max="30" value="0">
  <span class="val" id="dot-y-val">0</span>
</div>

<!-- ═══ SECTION 3: Font size ═══ -->
<h2>3 &mdash; Symbol Size (bleed fix)</h2>
<div class="controls">
  <label>font-size (px)</label>
  <input type="range" id="dn-font-size" min="80" max="160" value="140">
  <span class="val" id="dn-font-size-val">140</span>

  <label>line-height</label>
  <input type="range" id="dn-line-height" min="0.8" max="2.0" value="1.4" step="0.05">
  <span class="val" id="dn-line-height-val">1.4</span>
</div>

<!-- ═══ SECTION 4: Output ═══ -->
<h2>4 &mdash; CSS / JS Output</h2>
<div class="output" id="css-output"></div>

<script>
var AUG_DOT = '\uE1E7';
var GLYPHS = {
  quarter: '\uE1D5',
  eighth: '\uE1D7',
  half: '\uE1D3',
  whole: '\uE1D2',
  sixteenth: '\uE1D9',
};

var TIE_EXAMPLES = [
  { label: 'Quarter + Eighth', parts: [
    { char: GLYPHS.quarter, dotted: false },
    { char: GLYPHS.eighth, dotted: false }
  ]},
  { label: 'Half + Quarter', parts: [
    { char: GLYPHS.half, dotted: false },
    { char: GLYPHS.quarter, dotted: false }
  ]},
  { label: 'Dotted Qtr + Eighth', parts: [
    { char: GLYPHS.quarter, dotted: true },
    { char: GLYPHS.eighth, dotted: false }
  ]},
  { label: 'Half + Half', parts: [
    { char: GLYPHS.half, dotted: false },
    { char: GLYPHS.half, dotted: false }
  ]},
  { label: 'Half + Eighth', parts: [
    { char: GLYPHS.half, dotted: false },
    { char: GLYPHS.eighth, dotted: false }
  ]},
  { label: 'Qtr + Sixteenth', parts: [
    { char: GLYPHS.quarter, dotted: false },
    { char: GLYPHS.sixteenth, dotted: false }
  ]},
];

var DOT_EXAMPLES = [
  { label: 'Dotted quarter', type: 'quarter', char: GLYPHS.quarter },
  { label: 'Dotted half', type: 'half', char: GLYPHS.half },
  { label: 'Dotted eighth', type: 'eighth', char: GLYPHS.eighth },
  { label: 'Dotted sixteenth', type: 'sixteenth', char: GLYPHS.sixteenth },
  { label: 'Dotted whole', type: 'whole', char: GLYPHS.whole },
];

function renderTiePreviews() {
  var container = document.getElementById('tie-previews');
  container.innerHTML = '';
  TIE_EXAMPLES.forEach(function (ex, i) {
    var card = document.createElement('div');
    card.className = 'preview-card';
    var lbl = document.createElement('div');
    lbl.className = 'preview-label';
    lbl.textContent = ex.label;
    var wrap = document.createElement('div');
    wrap.className = 'preview-wrap';
    wrap.id = 'tw-' + i;

    var parts = ex.parts.map(function (p) {
      var dot = p.dotted ? AUG_DOT : '';
      return '<span class="dn-glyph">' + p.char + dot + '</span>';
    }).join('<span class="dn-tie-gap"></span>');
    wrap.innerHTML = '<div class="dn-symbol dn-tied">' + parts + '<span class="dn-tie-arc"></span></div>';

    card.appendChild(lbl);
    card.appendChild(wrap);
    container.appendChild(card);
  });
  positionAllTieArcs();
}

function renderDotPreviews() {
  var container = document.getElementById('dot-previews');
  container.innerHTML = '';
  DOT_EXAMPLES.forEach(function (ex, i) {
    var card = document.createElement('div');
    card.className = 'preview-card';
    var lbl = document.createElement('div');
    lbl.className = 'preview-label';
    lbl.textContent = ex.label;
    var wrap = document.createElement('div');
    wrap.className = 'preview-wrap';
    wrap.id = 'dw-' + i;

    wrap.innerHTML = '<div class="dn-symbol" data-note="' + ex.type + '">' +
      ex.char + '<span class="dn-aug-dot" data-note="' + ex.type + '">' + AUG_DOT + '</span></div>';

    card.appendChild(lbl);
    card.appendChild(wrap);
    container.appendChild(card);
  });
}

function getAnchor() {
  return parseFloat(document.getElementById('tie-anchor').value) / 100;
}

function positionAllTieArcs() {
  var anchor = getAnchor();
  requestAnimationFrame(function () {
    document.querySelectorAll('.dn-tied').forEach(function (parent) {
      var glyphs = parent.querySelectorAll('.dn-glyph');
      var arc = parent.querySelector('.dn-tie-arc');
      if (!arc || glyphs.length < 2) return;
      var pr = parent.getBoundingClientRect();
      var g1 = glyphs[0].getBoundingClientRect();
      var g2 = glyphs[glyphs.length - 1].getBoundingClientRect();
      var x1 = (g1.left - pr.left) + g1.width * anchor;
      var x2 = (g2.left - pr.left) + g2.width * anchor;
      arc.style.left = x1 + 'px';
      arc.style.width = (x2 - x1) + 'px';
    });
  });
}

var TIE_SLIDERS = ['tie-bottom', 'tie-height', 'tie-border', 'tie-note-gap', 'tie-pad-bottom', 'tie-anchor'];
var DOT_SLIDERS = ['dot-quarter-x', 'dot-half-x', 'dot-eighth-x', 'dot-sixteenth-x', 'dot-whole-x', 'dot-y'];
var SIZE_SLIDERS = ['dn-font-size', 'dn-line-height'];
var ALL_SLIDERS = TIE_SLIDERS.concat(DOT_SLIDERS).concat(SIZE_SLIDERS);

function updateAll() {
  var root = document.documentElement.style;
  ALL_SLIDERS.forEach(function (id) {
    var el = document.getElementById(id);
    var val = el.value;
    document.getElementById(id + '-val').textContent = val;
  });

  root.setProperty('--tie-bottom', document.getElementById('tie-bottom').value + 'px');
  root.setProperty('--tie-height', document.getElementById('tie-height').value + 'px');
  root.setProperty('--tie-border', document.getElementById('tie-border').value + 'px');
  root.setProperty('--tie-note-gap', document.getElementById('tie-note-gap').value + 'px');
  root.setProperty('--tie-pad-bottom', document.getElementById('tie-pad-bottom').value + 'px');
  root.setProperty('--dn-font-size', document.getElementById('dn-font-size').value + 'px');
  root.setProperty('--dn-line-height', document.getElementById('dn-line-height').value);

  // Per-note dot offsets
  ['quarter', 'half', 'eighth', 'sixteenth', 'whole'].forEach(function (note) {
    var dx = document.getElementById('dot-' + note + '-x').value;
    var dy = document.getElementById('dot-y').value;
    document.querySelectorAll('.dn-aug-dot[data-note="' + note + '"]').forEach(function (dot) {
      dot.style.position = 'relative';
      dot.style.left = dx + 'px';
      dot.style.top = dy + 'px';
    });
  });

  positionAllTieArcs();
  updateOutput();
}

function updateOutput() {
  var v = {};
  ALL_SLIDERS.forEach(function (id) { v[id] = document.getElementById(id).value; });

  var out = '/* === Tie arc === */\n';
  out += '.dn-symbol.dn-tied .dn-tie-arc {\n';
  out += '  bottom: ' + v['tie-bottom'] + 'px;\n';
  out += '  height: ' + v['tie-height'] + 'px;\n';
  out += '  border-width: ' + v['tie-border'] + 'px;\n';
  out += '}\n';
  out += '.dn-symbol.dn-tied .dn-tie-gap { width: ' + v['tie-note-gap'] + 'px; }\n';
  out += '.dn-symbol.dn-tied { padding-bottom: ' + v['tie-pad-bottom'] + 'px; }\n';
  out += 'positionTieArc anchor: ' + v['tie-anchor'] + '%\n\n';

  out += '/* === Dot offsets (per note) === */\n';
  out += 'DOT_OFFSETS = {\n';
  ['quarter', 'half', 'eighth', 'sixteenth', 'whole'].forEach(function (note) {
    out += '  "' + note + '": { x: ' + v['dot-' + note + '-x'] + ', y: ' + v['dot-y'] + ' },\n';
  });
  out += '};\n\n';

  out += '/* === Symbol size === */\n';
  out += '.dn-symbol { font-size: ' + v['dn-font-size'] + 'px; line-height: ' + v['dn-line-height'] + '; }\n';

  document.getElementById('css-output').textContent = out;
}

ALL_SLIDERS.forEach(function (id) {
  document.getElementById(id).addEventListener('input', updateAll);
});

document.getElementById('css-output').addEventListener('click', function() {
  navigator.clipboard.writeText(this.textContent).then(function() {
    document.getElementById('css-output').classList.add('copied');
    setTimeout(function() { document.getElementById('css-output').classList.remove('copied'); }, 1200);
  });
});

document.fonts.load("140px 'Bravura Text'", '\uE1D5').then(function() {
  renderTiePreviews();
  renderDotPreviews();
  updateAll();
}).catch(function() {
  renderTiePreviews();
  renderDotPreviews();
  updateAll();
});
</script>
</body>
</html>
